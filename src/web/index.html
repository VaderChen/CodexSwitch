<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodexSwitch</title>
  <style>/* STYLE_PLACEHOLDER */</style>
</head>
<body>
  <main class="shell">

    <section class="card login-card">
      <div class="section-title"><div class="title-with-icon"><img class="app-icon" src="data:image/png;base64,<!-- APP_ICON -->" alt="CodexSwitch"><div><h2>新增帳號</h2><p>按下登入後，會在預設瀏覽器完成 ChatGPT 授權。</p></div></div><span class="lock">⌁</span></div>
      <label for="email">ChatGPT 帳號 Email</label>
      <div class="input-row"><input id="email" type="email" autocomplete="email" placeholder="you@example.com" /><button id="loginButton" onclick="login()"><span class="button-label">開啟瀏覽器登入</span><span class="spinner"></span></button><button id="cancelLoginButton" class="cancel-login" onclick="handleCancelLogin()" hidden>取消登入</button></div>
      <p class="hint">本機只監聽 127.0.0.1 的一次性 callback，完成後即關閉。</p>
    </section>
    <section class="accounts-section"><div class="list-heading"><div><h2>已連結帳號</h2><p id="count">0 個帳號</p></div><div class="list-actions"><button class="detect" onclick="handleExportAccounts()">匯出</button><button class="detect" onclick="handleImportAccounts()">匯入</button><button class="detect" onclick="handleDetectCurrent()">偵測目前帳號</button><button class="refresh" onclick="loadAccounts()" title="重新整理">↻</button></div></div><div id="accountList" class="account-list"></div><div id="empty" class="empty"><div class="empty-icon">◎</div><p>尚未連結帳號</p><span>完成一次登入後，帳號會顯示在這裡。</span></div></section>
    <aside id="updateNotice" class="update-notice" hidden><button type="button" onclick="openAbout()"><span id="updateNoticeText"></span></button><progress id="downloadProgress" max="100" value="0" aria-label="更新下載進度" hidden></progress></aside>
    <footer><button class="about-link" onclick="openAbout()">About</button><span id="appVersion"><!-- APP_VERSION --></span></footer>
  </main>
<div id="message" class="message" role="status" aria-live="polite" aria-atomic="true"></div>
<div id="dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1" hidden><div class="dialog"><h3 id="dialogTitle"></h3><p id="dialogText"></p><div class="dialog-actions"><button id="dialogCancel" class="dialog-cancel">取消</button><button id="dialogOK" class="dialog-ok">確認套用</button></div></div></div>
<div id="settingsDialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-label="Codex 環境設定" tabindex="-1" hidden><form class="dialog settings-dialog" onsubmit="saveSettings(event)"><h3>Codex 環境設定</h3><p id="settingsEmail"></p><label for="settingsHome">CODEX_HOME</label><input id="settingsHome" type="text" autocomplete="off"><label for="settingsData">USER_DATA_DIR</label><input id="settingsData" type="text" autocomplete="off"><p class="settings-hint">留空會填入系統預設值，儲存後於下次套用生效。</p><div class="dialog-actions"><button type="button" class="dialog-cancel" onclick="closeSettings()">取消</button><button id="settingsSave" type="submit" class="dialog-ok">儲存</button></div></form></div>
<div id="resetDialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-label="用量重置" tabindex="-1" hidden><div class="dialog"><h3>用量重置</h3><p id="resetEmail"></p><p id="resetCount"><span id="resetSpinner" class="reset-spinner" hidden></span><span id="resetCountText">讀取中…</span></p><p class="reset-hint">長按 2 秒使用 1 次重置，無法復原。</p><div id="resetCredits"></div><div class="dialog-actions"><button id="resetClose" class="dialog-cancel" onclick="closeReset()">關閉</button></div></div></div>
<div id="billingDialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="billingTitle" tabindex="-1" hidden><section class="dialog billing-dialog"><h3 id="billingTitle">帳單與收據</h3><p id="billingEmail"></p><p class="billing-hint">下載會在瀏覽器開啟 Stripe 帳單頁，可於該頁下載 PDF 或收據。</p><div class="billing-toolbar"><button id="billingQuery" class="detect" onclick="handleQueryBilling()">查詢帳單</button><span id="billingSpinner" class="reset-spinner" aria-hidden="true" hidden></span></div><p id="billingMessage" class="billing-message" role="status" aria-live="polite"></p><div id="billingList" class="billing-list" aria-busy="false"><table id="billingTable" hidden><caption class="billing-caption">帳單交易紀錄</caption><thead><tr><th scope="col">日期</th><th scope="col">產品</th><th scope="col">金額</th><th scope="col">狀態</th><th scope="col">下載</th></tr></thead><tbody id="billingRows"></tbody></table></div><div class="billing-bottom"><button id="billingMore" class="detect" onclick="handleQueryBilling(true)" hidden>載入較早紀錄</button><button id="billingClose" class="dialog-cancel" onclick="closeBilling()">關閉</button></div></section></div>
<div id="aboutDialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-label="關於 CodexSwitch" tabindex="-1" hidden><div class="dialog about-dialog"><div class="about-heading"><h3>關於 CodexSwitch</h3><label class="hint-switch"><span>按鈕提示</span><input id="buttonHintsToggle" type="checkbox" role="switch" checked onchange="toggleButtonHints(this.checked)"><span class="switch-track" aria-hidden="true"></span></label></div><p>CodexSwitch</p><p id="aboutVersion"></p><p><button class="about-github" onclick="handleOpenGitHub()">GitHub 專案</button></p><p id="updateStatus"></p><div id="updateProgress" class="update-progress" hidden><span></span></div><div class="dialog-actions"><button class="dialog-cancel" onclick="closeAbout()">關閉</button><button id="forceUpdateButton" class="dialog-cancel" onclick="handleForceUpdate()">強制更新</button><button id="updateButton" class="dialog-ok" onclick="handleCheckForUpdate()">檢查更新</button></div></div></div>
<div id="accountTooltip" class="account-tooltip" role="tooltip" hidden></div>
<div id="buttonTooltip" class="account-tooltip button-tooltip" role="tooltip" hidden></div>
<script>
const $ = id => document.getElementById(id);
let messageTimer;
let buttonHintsEnabled='<!-- BUTTON_HINTS -->'!=='false';
$('buttonHintsToggle').checked=buttonHintsEnabled;
async function toggleButtonHints(enabled){
 const previous=buttonHintsEnabled;
 buttonHintsEnabled=enabled;
 $('buttonTooltip').hidden=true;
 const toggle=$('buttonHintsToggle');toggle.disabled=true;
 try{await window.saveButtonHints(enabled);}
 catch(e){buttonHintsEnabled=previous;toggle.checked=previous;setMessage('無法儲存提示設定：'+(e.message||e),'error');}
 finally{toggle.disabled=false;}
}
const buttonHints={
 'loginButton':'開啟瀏覽器登入 Codex 帳號','cancelLoginButton':'取消目前登入流程',
 'dialogCancel':'取消操作','dialogOK':'確認套用帳號','resetClose':'關閉用量重置',
 'forceUpdateButton':'直接下載並安裝最新正式版，即使版本相同也重新安裝',
 'updateButton':'檢查 GitHub Releases 是否有新版本', 'settingsSave':'儲存 Codex 環境設定，下次套用時生效'
};
function applyButtonTooltips(root=document){
 root.querySelectorAll('button').forEach(button=>{
  const hint=button.dataset.tooltip||buttonHints[button.id]||button.title||button.getAttribute('aria-label')||button.textContent.trim().replace(/\s+/g,' ');
  if(hint)button.dataset.tooltip=hint;
  button.removeAttribute('title');
 });
}
applyButtonTooltips();
new MutationObserver(()=>applyButtonTooltips($('accountList'))).observe($('accountList'),{childList:true});
const buttonDescriptions={
 '重置':'搜尋該帳號之重置卷、在列表中長按後可重置額度',
 '帳單':'查詢此帳號的帳單，開啟 Stripe 帳單頁下載 PDF 或收據',
 '套用':'立即更新 Codex App 設定與環境參數來使用此帳號',
 '匯出':'匯出帳號列表與相關資料', '匯入':'匯入帳號列表與相關資料',
 '偵測目前帳號':'偵測所有執行中的 Codex App 帳號', '↻':'重新整理帳號列表',
 '長按重置':'長按 2 秒以使用這張重置卷並重置額度', '關閉':'關閉目前視窗',
 '儲存':'儲存Codex 環境設定', '取消':'取消目前操作', '確認套用':'確認套用此帳號'
};
function buttonHintText(button){return buttonDescriptions[button.textContent.trim()]||button.dataset.tooltip||button.title||'';}
function showButtonTooltip(event){if(!buttonHintsEnabled)return;const b=event.target.closest('button');if(!b)return;hideAccountTooltip();const text=buttonHintText(b);if(!text)return;const tip=$('buttonTooltip');tip.textContent=text;tip.hidden=false;const r=b.getBoundingClientRect(),box=tip.getBoundingClientRect();tip.style.left=`${Math.max(12,Math.min(r.left,innerWidth-box.width-12))}px`;tip.style.top=`${r.bottom+box.height+10<=innerHeight?r.bottom+8:Math.max(12,r.top-box.height-8)}px`;}
function hideButtonTooltip(event){if(event.target.closest('button'))$('buttonTooltip').hidden=true;}
document.addEventListener('mouseover',showButtonTooltip); document.addEventListener('mouseout',hideButtonTooltip);
let activeModal=null;
let applyBusy=false;
let removeBusy=false;
let modalReturnFocus=null;
let modalBackground=[];
function openModal(id,focusID){
 if(id!=='dialog' && (applyBusy||removeBusy))return false;
 if(activeModal)return activeModal===id;
 const modal=$(id);
 activeModal=id;modalReturnFocus=document.activeElement;
 modalBackground=Array.from(document.querySelectorAll('body > *')).filter(el=>el!==modal).map(el=>[el,el.inert]);
 modalBackground.forEach(([el])=>el.inert=true);
 modal.hidden=false;
 for(const tipID of ['accountTooltip','buttonTooltip'])if($(tipID))$(tipID).hidden=true;
 ($(focusID)||modal).focus?.();
 return true;
}
function closeModal(id){
 if(activeModal!==id)return;
 $(id).hidden=true;activeModal=null;
 modalBackground.forEach(([el,inert])=>el.inert=inert);modalBackground=[];
 const previous=modalReturnFocus;modalReturnFocus=null;
 restoreAccountFocus(previous);
}
function restoreAccountFocus(previous){
 if(!previous)return;
 if(previous.isConnected){previous.focus();return;}
 const accountID=previous.closest?.('.account')?.dataset.accountId;
 if(!accountID)return;
 const row=Array.from($('accountList').querySelectorAll('.account')).find(el=>el.dataset.accountId===accountID);
 const target=row&&Array.from(row.querySelectorAll('button[data-action]')).find(el=>el.dataset.action===previous.dataset.action&&!el.disabled);
 (target||row?.querySelector('.account-info')||document.querySelector('.refresh'))?.focus();
}
function modalFocusables(modal){
 return Array.from(modal.querySelectorAll('button:not(:disabled),input:not(:disabled),a[href],[tabindex]:not([tabindex="-1"])')).filter(el=>!el.hidden&&el.getClientRects().length);
}
function openAbout(){ if(!openModal('aboutDialog','buttonHintsToggle'))return; $('aboutVersion').textContent='版本 '+$('appVersion').textContent; $('updateStatus').textContent=''; $('updateProgress').hidden=true; if(typeof window.getUpdateStatus==='function'){startUpdatePolling();refreshUpdateStatus();} }
function closeAbout(){ closeModal('aboutDialog'); }
async function handleOpenGitHub(){ try { if(typeof window.openGitHub!=='function') throw Error('開啟 GitHub 服務尚未就緒'); await window.openGitHub(); } catch(e) { setMessage(e.message||String(e),'error'); } }
let updatePolling=null;
let updateRequestBusy=false;
let startupUpdateChecked=false;
function startUpdatePolling(){if(updatePolling===null)updatePolling=setInterval(refreshUpdateStatus,250);}
async function checkStartupUpdate(){
 if(startupUpdateChecked||typeof window.checkForUpdate!=='function'||typeof window.getUpdateStatus!=='function')return;
 startupUpdateChecked=true;
 try{await window.checkForUpdate();startUpdatePolling();await refreshUpdateStatus();}catch(_){/* 手動檢查仍可重試。 */}
}
async function refreshUpdateStatus(){
 if(updateRequestBusy)return;updateRequestBusy=true;
 try{
  const state=await window.getUpdateStatus();
  $('updateStatus').textContent=state.message||'';
  const busy=['checking','downloading','installing','restarting'].includes(state.phase);
  const button=$('updateButton');button.disabled=busy;
  $('forceUpdateButton').disabled=busy;
  button.textContent=state.phase==='available'?'下載並安裝':'檢查更新';
  button.dataset.install=state.phase==='available'?'true':'false';
  const progress=$('updateProgress');progress.hidden=!busy;
  progress.classList.toggle('active',state.phase==='checking'||state.phase==='installing');
  if(state.phase==='downloading'){
   const percent=state.total>0?Math.min(100,state.downloaded/state.total*100):0;
   progress.querySelector('span').style.width=percent+'%';
   $('updateStatus').textContent=`下載 ${Math.floor(percent)}%（${(state.downloaded/1048576).toFixed(1)} / ${(state.total/1048576).toFixed(1)} MB）`;
  }else{progress.querySelector('span').style.width='35%';}
  const notice=$('updateNotice');
  notice.hidden=!['available','downloading','installing','restarting'].includes(state.phase);
  $('updateNoticeText').textContent=state.phase==='available'?`發現新版本 ${state.version}，點此更新`:$('updateStatus').textContent;
  const meter=$('downloadProgress');meter.hidden=state.phase!=='downloading';
  if(state.total>0)meter.value=Math.min(100,(state.downloaded||0)/state.total*100);else meter.removeAttribute('value');
  if(!busy){clearInterval(updatePolling);updatePolling=null;}
 }catch(e){$('updateStatus').textContent='更新服務錯誤：'+(e.message||e);$('updateButton').disabled=false;$('forceUpdateButton').disabled=false;clearInterval(updatePolling);updatePolling=null;}
 finally{updateRequestBusy=false;}
}
async function handleForceUpdate(){
 const button=$('forceUpdateButton');if(button.disabled)return;
 button.disabled=true;$('updateButton').disabled=true;
 try{
  if(typeof window.forceUpdate!=='function')throw Error('強制更新服務尚未就緒，請重新啟動 App');
  await window.forceUpdate();startUpdatePolling();await refreshUpdateStatus();
 }catch(e){button.disabled=false;$('updateButton').disabled=false;$('updateStatus').textContent=e.message||String(e);}
}
async function handleCheckForUpdate(){
 const button=$('updateButton');button.disabled=true;
 try{
  if(button.dataset.install==='true')await window.installUpdate();else await window.checkForUpdate();
  clearInterval(updatePolling);updatePolling=setInterval(refreshUpdateStatus,250);
  await refreshUpdateStatus();
 }catch(e){button.disabled=false;$('updateStatus').textContent=e.message||String(e);}
}

function setMessage(text, kind='') {
 clearTimeout(messageTimer);
 const message=$('message');
 message.textContent=text;
 message.className=text?'message '+kind+' visible':'message';
 if(text) messageTimer=setTimeout(()=>{
  message.className='message';
  message.textContent='';
 },3000);
}
function esc(value) { return String(value).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatDate(value) {
 if(!value)return '';
 const d=new Date(value);if(isNaN(d))return '';
 const pad=n=>String(n).padStart(2,'0');
 return `${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
let billingSequence=0;
let billingView=0;
let billingAccountID='';
let billingTransactions=[];
let billingNextCursor='';
let billingLoading=false;
let billingQueried=false;
const billingCursors=new Set();
const billingDownloads=new Set();
const billingWaiters=new Map();
window.receiveBillingResult=(requestID,raw)=>{
 const pending=billingWaiters.get(requestID);
 if(!pending)return;
 billingWaiters.delete(requestID);clearTimeout(pending.timer);
 try{
  const result=typeof raw==='string'?JSON.parse(raw):raw;
  if(!result || typeof result!=='object' || Array.isArray(result))throw Error('帳單服務回傳格式錯誤');
  if(result.error)throw Error(String(result.error));
  pending.resolve(result);
 }catch(e){pending.reject(e);}
};
function billingRequest(method,args){
 const requestID='billing-'+(++billingSequence);
 return new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>{
   billingWaiters.delete(requestID);cancelBillingRequest(requestID);
   reject(Error('帳單服務逾時，請重試。'));
  },30000);
  billingWaiters.set(requestID,{resolve,reject,timer});
  // 先登記 callback；bridge 即使先推送結果或未完成回傳，也能正確結束。
  Promise.resolve().then(()=>{
   if(!billingWaiters.has(requestID))return {cancelled:true};
   if(typeof window[method]!=='function')throw Error('帳單服務尚未就緒，請重新啟動 App。');
   return window[method](...args,requestID);
  }).then(raw=>{
   const initial=typeof raw==='string'?JSON.parse(raw):raw;
   if(!initial?.pending)window.receiveBillingResult(requestID,initial);
  }).catch(e=>window.receiveBillingResult(requestID,{error:e.message||String(e)}));
 });
}
function cancelBillingRequest(requestID){
 if(typeof window.cancelBilling==='function')Promise.resolve().then(()=>window.cancelBilling(requestID)).catch(()=>{});
}
function closeBilling(){
 if(activeModal!=='billingDialog')return;
 billingView++;
 const pendingRequests=Array.from(billingWaiters.entries());billingWaiters.clear();
 for(const [requestID,pending] of pendingRequests){clearTimeout(pending.timer);pending.resolve({cancelled:true});cancelBillingRequest(requestID);}
 billingDownloads.clear();billingLoading=false;
 closeModal('billingDialog');
}
function openBilling(id){
 if(activeModal)return;
 const account=accountRows.find(a=>a.id===id);
 if(!account){setMessage('找不到此帳號','error');return;}
 if(!openModal('billingDialog','billingQuery'))return;
 billingView++;billingAccountID=id;billingTransactions=[];billingNextCursor='';billingLoading=false;billingQueried=false;
 billingCursors.clear();billingDownloads.clear();
 $('billingEmail').textContent=account.email;
 billingMessage('按下「查詢帳單」取得此帳號的交易紀錄。');
 renderBilling();$('billingQuery').focus();
}
function billingMessage(text,error=false){
 $('billingMessage').textContent=text;
 $('billingMessage').classList.toggle('error',error);
}
function billingAmount(transaction){
 if(!Number.isSafeInteger(transaction.amount) || typeof transaction.currency!=='string' || !/^[a-z]{3}$/i.test(transaction.currency))return '金額未提供';
 try{
  const formatter=new Intl.NumberFormat('zh-TW',{style:'currency',currency:transaction.currency.toUpperCase(),currencyDisplay:'code'});
  return formatter.format(transaction.amount/10**formatter.resolvedOptions().maximumFractionDigits);
 }catch(_){return '金額未提供';}
}
function renderBilling(){
 const body=$('billingRows');body.replaceChildren();
 const statuses={paid:'已付款',open:'待付款',draft:'草稿',void:'已作廢',uncollectible:'無法收款',refunded:'已退款'};
 for(const transaction of billingTransactions){
  const row=document.createElement('tr');
  const date=typeof transaction.created_at==='string'?new Date(transaction.created_at):new Date(NaN);
  const product=transaction.product;
  const productText=product&&typeof product==='object'?[product.type,product.plan].filter(value=>typeof value==='string'&&value).join(' · '):'';
  const status=typeof transaction.status==='string'?transaction.status:'';
  for(const value of [Number.isNaN(date.getTime())?'日期未提供':date.toLocaleDateString('zh-TW'),productText||'產品未提供',billingAmount(transaction),Object.prototype.hasOwnProperty.call(statuses,status)?statuses[status]:status||'未知狀態']){
   const cell=document.createElement('td');cell.textContent=value;row.append(cell);
  }
  const cell=document.createElement('td'),button=document.createElement('button');
  const downloadID=typeof transaction.download_id==='string'?transaction.download_id:'';
  button.type='button';button.className='billing-download';button.textContent='下載';
  button.dataset.billingDownload=downloadID;
  button.dataset.tooltip=downloadID?'開啟 Stripe 帳單頁，於瀏覽器下載 PDF 或收據':'此交易未提供可下載的帳單';
  button.setAttribute('aria-label',button.dataset.tooltip);
  button.disabled=!downloadID||billingDownloads.has(downloadID);
  button.onclick=()=>downloadBillingInvoice(downloadID);
  cell.append(button);row.append(cell);body.append(row);
 }
 $('billingTable').hidden=!billingTransactions.length;
 $('billingMore').hidden=!billingNextCursor;
 $('billingMore').disabled=billingLoading;
 $('billingQuery').disabled=billingLoading;
 $('billingQuery').textContent=billingQueried?'重新查詢':'查詢帳單';
 $('billingSpinner').hidden=!billingLoading;
 $('billingList').setAttribute('aria-busy',String(billingLoading));
}
async function handleQueryBilling(more=false){
 if(activeModal!=='billingDialog' || billingLoading || (more&&!billingNextCursor))return;
 const view=billingView,id=billingAccountID,cursor=more?billingNextCursor:'';
 billingLoading=true;billingQueried=true;
 if(!more){billingTransactions=[];billingNextCursor='';billingCursors.clear();}
 billingMessage(more?'正在載入較早的紀錄…':'正在查詢帳單…');renderBilling();
 try{
  const result=await billingRequest('queryBilling',[id,cursor]);
  if(view!==billingView || result.cancelled)return;
  if(!Array.isArray(result.transactions) || (result.next_cursor!==undefined && typeof result.next_cursor!=='string'))throw Error('帳單服務回傳格式錯誤');
  const unique=new Map(billingTransactions.map(item=>[JSON.stringify([item.type,item.id]),item]));
  for(const item of result.transactions){
   if(!item || typeof item!=='object' || Array.isArray(item) || typeof item.id!=='string' || !item.id || typeof item.type!=='string')throw Error('帳單服務回傳格式錯誤');
   unique.set(JSON.stringify([item.type,item.id]),item);
  }
  billingTransactions=Array.from(unique.values()).sort((a,b)=>(Date.parse(b.created_at)||0)-(Date.parse(a.created_at)||0));
  billingCursors.add(cursor);
  billingNextCursor=result.next_cursor&&!billingCursors.has(result.next_cursor)?result.next_cursor:'';
  billingMessage(billingTransactions.length?`已載入 ${billingTransactions.length} 筆交易。`:'目前沒有交易紀錄。');
 }catch(e){if(view===billingView)billingMessage(e.message||String(e),true);}
 finally{if(view===billingView){billingLoading=false;renderBilling();}}
}
async function downloadBillingInvoice(downloadID){
 if(activeModal!=='billingDialog' || !downloadID || billingDownloads.has(downloadID) || !billingTransactions.some(item=>item.download_id===downloadID))return;
 const view=billingView,id=billingAccountID;
 billingDownloads.add(downloadID);
 document.querySelectorAll('#billingRows button').forEach(button=>{if(button.dataset.billingDownload===downloadID)button.disabled=true;});
 billingMessage('正在開啟 Stripe 帳單頁…');
 try{
  const result=await billingRequest('openBillingInvoice',[id,downloadID]);
  if(view!==billingView || result.cancelled)return;
  if(result.opened!==true)throw Error('帳單下載服務回傳格式錯誤');
  billingMessage('已開啟 Stripe 帳單頁，請在瀏覽器下載 PDF 或收據。');
 }catch(e){if(view===billingView)billingMessage(e.message||String(e),true);}
 finally{
  if(view===billingView){
   billingDownloads.delete(downloadID);
   document.querySelectorAll('#billingRows button').forEach(button=>{if(button.dataset.billingDownload===downloadID)button.disabled=false;});
  }
 }
}

let resetSequence=0;
const resetWaiters=new Map();
window.receiveResetResult=(id,result)=>{const pending=resetWaiters.get(id);if(pending){resetWaiters.delete(id);clearTimeout(pending.timer);pending.resolve(result);}};
async function resetRequest(action,id,credit='',key=''){
 const requestID=String(++resetSequence);
 const completion=new Promise((resolve,reject)=>{
  const timer=setTimeout(()=>{resetWaiters.delete(requestID);reject(Error('請求逾時，重試會沿用同一請求'));},35000);
  resetWaiters.set(requestID,{resolve,reject,timer});
 });
 try{
  const raw=await window.resetAccountAction(action,id,credit,key,requestID);
  const initial=typeof raw==='string'?JSON.parse(raw):raw;
  if(!initial.pending)window.receiveResetResult(requestID,initial);
 }catch(e){window.receiveResetResult(requestID,{error:e.message||String(e)});}
 const result=await completion;
 if(result.error)throw Error(result.error);
 return result;
}
let resetAccountID='';
let resetItems=[];
let resetConsuming=false;
let resetView=0;
function closeReset(){if(resetConsuming)return;cancelResetHold();resetView++;closeModal('resetDialog');}
async function openReset(id){
 if(resetConsuming)return;
 if(!openModal('resetDialog','resetClose'))return;
 hideAccountTooltip();
 cancelResetHold();
 const view=++resetView;
 resetAccountID=id;
 $('resetEmail').textContent=accountRows.find(a=>a.id===id)?.email||'';
 $('resetCountText').textContent='讀取中…';$('resetSpinner').hidden=false;$('resetCredits').innerHTML='';
 try{
  const data=await resetRequest('list',id);
  if(view!==resetView)return;
  resetItems=data.credits||[];
  $('resetCountText').textContent=`可用次數：${data.available_count??'-'}`;$('resetSpinner').hidden=true;
  $('resetCredits').innerHTML=resetItems.length?resetItems.map((item,i)=>`<div class="reset-credit"><span>到期 ${esc(formatDate(item.expires_at))}</span><button class="use-account hold-reset" onpointerdown="beginResetHold(event,${i})" onpointerup="cancelResetHold(true)" onpointerleave="cancelResetHold()" onpointercancel="cancelResetHold()" onkeydown="resetHoldKey(event,${i})" onkeyup="resetHoldKeyUp(event)" onblur="cancelResetHold()" onclick="event.preventDefault()"><span>長按重置</span></button></div>`).join(''):'<p>目前沒有可用的重置明細。</p>';
 }catch(e){if(view===resetView){$('resetCountText').textContent=e.message;$('resetSpinner').hidden=true;}}
}
let resetHoldTimer=null;
let resetHoldButton=null;
function cancelResetHold(released=false){
 const held=resetHoldTimer!==null;
 if(held)clearTimeout(resetHoldTimer);
 resetHoldTimer=null;
 resetHoldButton?.classList.remove('is-holding');resetHoldButton=null;
 if(held && released)setMessage('請持續按住 2 秒才會重置。');
}
function beginResetHold(event,index){
 if(event.type==='pointerdown' && event.button!==0)return;
 event.preventDefault();
 if(resetConsuming || resetHoldTimer!==null || event.currentTarget.disabled)return;
 resetHoldButton=event.currentTarget;
 resetHoldButton.classList.add('is-holding');
 resetHoldTimer=setTimeout(()=>{cancelResetHold();consumeReset(index);},2000);
}
function resetHoldKey(event,index){if((event.key===' '||event.key==='Enter')&&!event.repeat)beginResetHold(event,index);else if(event.key===' '||event.key==='Enter')event.preventDefault();}
function resetHoldKeyUp(event){if(event.key===' '||event.key==='Enter'){event.preventDefault();cancelResetHold(true);}}
if(typeof window.addEventListener==='function')window.addEventListener('blur',()=>cancelResetHold());
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelResetHold();});
async function consumeReset(index){
 if(resetConsuming)return;
 const item=resetItems[index];if(!item)return;
 const id=resetAccountID;

 resetConsuming=true;$('resetClose').disabled=true;
 document.querySelectorAll('#resetCredits button').forEach(b=>b.disabled=true);

 try{
  const key=''; // 後端在送出前持久保存請求 ID，逾時與重啟後沿用。
  const result=await resetRequest('consume',id,item.id,key);
  const messages={reset:'重置完成',already_redeemed:'此重置請求先前已完成',no_credit:'沒有可用重置次數',nothing_to_reset:'目前無需重置'};
  if(!messages[result.code])throw Error('重置結果未知');

  setMessage(messages[result.code],'success');
  await refreshUsage();
 }catch(e){setMessage(e.message||String(e),'error');}
 finally{resetConsuming=false;$('resetClose').disabled=false;await openReset(id);}
}
let usageCache={};
function usageWindow(value,seconds){return value?.windows?.find(w=>w.seconds===seconds);}
function remainingText(window){return window && Number.isFinite(window.remaining)?`${Math.floor(window.remaining)}%`:'-';}
function usageText(value){
 return `${remainingText(usageWindow(value,18000))} / ${remainingText(usageWindow(value,604800))}`;
}
function nextResetText(value,now=Date.now()){
 const times=(value?.windows||[]).filter(w=>w.seconds===18000||w.seconds===604800).map(w=>w.reset_at*1000).filter(t=>Number.isFinite(t)&&t>now);
 return times.length?formatDate(Math.min(...times)):'-';
}
function accountDetails(account,value){
 const windowLine=(label,seconds)=>{
  const w=usageWindow(value,seconds);
  return `<span>${esc(label)}</span><span class="tooltip-percent">${esc(remainingText(w))}</span><span>自動重置</span><span>${esc(w?.reset_at?formatDate(w.reset_at*1000):'-')}</span>`;
 };
 const updated=value?.updated_at && new Date(value.updated_at).getFullYear()>=2000?formatDate(value.updated_at):'-';
 const status=value?.error?(value.windows?.length?' · 舊值':' · 暫不可用'):value?.loading?' · 更新中':'';
 return `<div class="tooltip-grid">${windowLine('5 小時',18000)}${windowLine('7 天',604800)}</div><div class="tooltip-updated">更新 ${esc(updated+status)}</div>`;
}
let hoveredAccount=null;
function hideAccountTooltip(){
 hoveredAccount?.removeAttribute('aria-describedby');
 hoveredAccount=null;
 const tip=$('accountTooltip');if(tip)tip.hidden=true;
}
function showAccountTooltip(event){
 if(draggedAccountID || !event.currentTarget.matches('.account-info'))return;
 $('buttonTooltip').hidden=true;
 hoveredAccount=event.currentTarget;
 updateAccountTooltip();
}
function updateAccountTooltip(){
 if(!hoveredAccount)return;
 if(!hoveredAccount.isConnected){hideAccountTooltip();return;}
 const accountID=hoveredAccount.closest('.account')?.dataset.accountId;
 const account=accountRows.find(a=>a.id===accountID);
 if(!account){hideAccountTooltip();return;}
 const tip=$('accountTooltip');
 tip.innerHTML=accountDetails(account,usageCache[account.id]);
 tip.hidden=false;
 hoveredAccount.setAttribute('aria-describedby','accountTooltip');
 const rect=hoveredAccount.getBoundingClientRect();
 const box=tip.getBoundingClientRect();
 const left=Math.max(12,Math.min(rect.left,window.innerWidth-box.width-12));
 const top=rect.bottom+box.height+10<=window.innerHeight?rect.bottom+8:Math.max(12,rect.top-box.height-8);
 tip.style.left=`${left}px`;tip.style.top=`${top}px`;
}
let usagePollBusy=false;
async function refreshUsage(){
 if(usagePollBusy || typeof window.getAccountUsage!=='function')return;
 usagePollBusy=true;
 try{
  const raw=await window.getAccountUsage();
  usageCache=typeof raw==='string'?JSON.parse(raw):raw;
  document.querySelectorAll('[data-usage-id]').forEach(el=>{
   const value=usageCache[el.dataset.usageId];
   el.textContent=usageText(value);
   el.classList.toggle('usage-stale',Boolean(value?.error && value?.windows?.length));
  });
  document.querySelectorAll('[data-reset-id]').forEach(el=>{el.textContent=nextResetText(usageCache[el.dataset.resetId]);});
  updateAccountTooltip();
 }catch(_){/* 背景查詢失敗不打斷目前操作。 */}
 finally{usagePollBusy=false;}
}

let accountLoadSequence=0;
async function loadAccounts() {
 const request=++accountLoadSequence;
 try {
  if(typeof window.getAccounts!=='function'){setTimeout(()=>{if(request===accountLoadSequence)loadAccounts();},150);return;}
  const raw=await window.getAccounts();
  if(request!==accountLoadSequence)return;
  const data=typeof raw==='string'?JSON.parse(raw):raw;
  if(!Array.isArray(data))throw new Error('帳號服務回傳格式錯誤');
  render(data);
  if(typeof window.acknowledgeUpdateReady==='function')window.acknowledgeUpdateReady();
  checkStartupUpdate();
 } catch(e){if(request===accountLoadSequence)setMessage('無法讀取帳號紀錄：'+(e.message||e),'error');}
}
$('accountList').addEventListener('click',event=>{
 const button=event.target.closest('button[data-action]');
 if(!button || button.disabled)return;
 const id=button.closest('.account')?.dataset.accountId;
 const handlers={settings:openSettings,reset:openReset,billing:openBilling,apply:handleApplyAccount,remove:removeAccount};
 handlers[button.dataset.action]?.(id);
});
let accountRows=[];
let draggedAccountID=null;
let reorderBusy=false;
function clearDropIndicators(){
 document.querySelectorAll('.account.drop-before,.account.drop-after').forEach(row=>row.classList.remove('drop-before','drop-after'));
}
function startAccountDrag(event){
 if(reorderBusy){event.preventDefault();return;}
 hideAccountTooltip();
 const row=event.currentTarget.closest('.account');
 draggedAccountID=row.dataset.accountId;
 event.dataTransfer.effectAllowed='move';
 event.dataTransfer.setData('text/plain',draggedAccountID);
 row.classList.add('dragging');
}
function accountDragOver(event){
 if(!draggedAccountID || reorderBusy)return;
 event.preventDefault();
 event.dataTransfer.dropEffect='move';
 clearDropIndicators();
 const row=event.currentTarget;
 if(row.dataset.accountId===draggedAccountID)return;
 const rect=row.getBoundingClientRect();
 row.classList.add(event.clientY<rect.top+rect.height/2?'drop-before':'drop-after');
}
function accountDragLeave(event){
 if(!event.currentTarget.contains(event.relatedTarget))event.currentTarget.classList.remove('drop-before','drop-after');
}
function endAccountDrag(){
 draggedAccountID=null;
 clearDropIndicators();
 document.querySelectorAll('.account.dragging').forEach(row=>row.classList.remove('dragging'));
}
async function dropAccount(event){
 event.preventDefault();
 if(!draggedAccountID || reorderBusy)return;
 const sourceID=draggedAccountID;
 const row=event.currentTarget;
 const targetID=row.dataset.accountId;
 const rect=row.getBoundingClientRect();
 const after=event.clientY>=rect.top+rect.height/2;
 endAccountDrag();
 if(sourceID===targetID)return;
 const source=accountRows.find(a=>a.id===sourceID);
 const next=accountRows.filter(a=>a.id!==sourceID);
 const targetIndex=next.findIndex(a=>a.id===targetID);
 if(!source || targetIndex<0)return;
 next.splice(targetIndex+(after?1:0),0,source);
 if(next.every((a,i)=>a.id===accountRows[i].id))return;
 reorderBusy=true;
 try{
  if(typeof window.reorderAccounts!=='function')throw Error('排序服務尚未就緒，請重新啟動 App');
  const raw=await window.reorderAccounts(next.map(a=>a.id));
  const result=typeof raw==='string'?JSON.parse(raw):raw;
  if(!result || result.error)throw Error(result&&result.error||'排序服務回傳格式錯誤');
  await loadAccounts();
  setMessage('帳號順序已儲存。','success');
 }catch(e){await loadAccounts();setMessage(e.message||String(e),'error');}
 finally{reorderBusy=false;}
}
function render(accounts) { const previous=document.activeElement; hideAccountTooltip(); accountRows=accounts; $('count').textContent=`${accounts.length} 個帳號`; $('empty').style.display=accounts.length?'none':'flex'; $('accountList').innerHTML=accounts.map(a=>`<article class="account" data-account-id="${esc(a.id)}" ondragover="accountDragOver(event)" ondragleave="accountDragLeave(event)" ondrop="dropAccount(event)"><button class="avatar account-settings" data-tooltip="Codex 環境設定：設定此帳號使用的 CODEX_HOME 與 USER_DATA_DIR，下次套用時生效。" aria-label="${esc(a.email)} 的 Codex 環境設定" data-action="settings">⚙</button><div class="account-info" tabindex="0" onmouseenter="showAccountTooltip(event)" onmouseleave="hideAccountTooltip()" onfocus="showAccountTooltip(event)" onblur="hideAccountTooltip()" draggable="true" ondragstart="startAccountDrag(event)" ondragend="endAccountDrag()"><strong>${esc(a.email)}</strong><span><time data-reset-id="${esc(a.id)}" title="下一次自動重置">${esc(nextResetText(usageCache[a.id]))}</time> · <em class="account-usage" data-usage-id="${esc(a.id)}">${esc(usageText(usageCache[a.id]))}</em></span></div>${a.is_current ? '<span class="current-account" role="img" aria-label="當前帳號" title="當前帳號"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m7.5 12 3 3 6-6"/></svg></span>' : ''}<span class="connected">已連結</span><button class="detect billing-account" data-action="billing">帳單</button><button class="use-account reset-account" data-action="reset">重置</button><button class="use-account" ${a.is_current ? 'disabled title="目前正在使用此帳號"' : ''} data-action="apply">套用</button><button class="delete" title="移除帳號" data-action="remove">×</button></article>`).join(''); if(!activeModal&&previous?.closest?.('.account'))restoreAccountFocus(previous); refreshUsage(); }
let settingsAccountID='';
let settingsDefaults={};
let settingsView=0;
let settingsSaving=false;
async function openSettings(id) {
 if(activeModal || applyBusy || removeBusy)return;
 const account=accountRows.find(a=>a.id===id);
 if(!account){setMessage('找不到此帳號','error');return;}
 if(!openModal('settingsDialog'))return;
 const view=++settingsView;
 settingsAccountID=id;
 $('settingsEmail').textContent=account.email;
 $('settingsHome').value=account.codex_home||'';
 $('settingsData').value=account.user_data_dir||'';
 for(const id of ['settingsHome','settingsData','settingsSave'])$(id).disabled=true;
 try {
  const raw=await window.getAccountDefaults();
  if(view!==settingsView || activeModal!=='settingsDialog')return;
  settingsDefaults=typeof raw==='string'?JSON.parse(raw):raw;
  $('settingsHome').value=account.codex_home||settingsDefaults.codex_home;
  $('settingsData').value=account.user_data_dir||settingsDefaults.user_data_dir;
 } catch(e){if(view===settingsView){closeModal('settingsDialog');setMessage(e.message||String(e),'error');}}
 finally{
  if(view===settingsView){
   for(const id of ['settingsHome','settingsData','settingsSave'])$(id).disabled=false;
   if(document.activeElement===$('settingsDialog'))$('settingsHome').focus();
  }
 }
}
function closeSettings(){if(!settingsSaving){settingsView++;closeModal('settingsDialog');}}
async function saveSettings(event) {
 event.preventDefault();
 const button=$('settingsSave');
 if(button.disabled)return;
 button.disabled=true;settingsSaving=true;
 try {
  $('settingsHome').value=$('settingsHome').value.trim()||settingsDefaults.codex_home;
  $('settingsData').value=$('settingsData').value.trim()||settingsDefaults.user_data_dir;
  const raw=await window.saveAccountSettings(settingsAccountID,$('settingsHome').value,$('settingsData').value);
  const result=typeof raw==='string'?JSON.parse(raw):raw;
  if(result.error)throw Error(result.error);
  await loadAccounts();
  closeModal('settingsDialog');
  setMessage('Codex 環境設定已儲存，下次套用時生效。','success');
 } catch(e){setMessage(e.message||String(e),'error');}
 finally{button.disabled=false;settingsSaving=false;}
}
async function handleCancelLogin() {
 const button=$('cancelLoginButton');
 button.disabled=true;
 try {
  if(typeof window.cancelLogin!=='function') throw new Error('取消服務尚未就緒');
  const raw=await window.cancelLogin();
  const result=typeof raw==='string'?JSON.parse(raw):raw;
  if(result.error) throw new Error(result.error);
 } catch(error) { button.disabled=false; setMessage(error.message||String(error),'error'); }
}
async function login() {
 const email=$('email').value.trim();
 if(!email || !$('email').checkValidity()){setMessage('請輸入有效的 Codex 帳號 Email。','error');$('email').focus();return;}
 const button=$('loginButton');
 if(button.disabled) return;
 try {
  button.disabled=true; button.classList.add('loading');
  $('cancelLoginButton').hidden=false;
  $('cancelLoginButton').disabled=false;
  setMessage('正在開啟瀏覽器，請完成 Codex 授權…');
  if(typeof window.startLogin!=='function') throw new Error('登入服務尚未就緒，請稍後重試。');
  const completion=new Promise(resolve=>{window.resolveLogin=resolve;});
  const raw=await window.startLogin(email);
  let result=typeof raw==='string'?JSON.parse(raw):raw;
  if(!result || typeof result!=='object') throw new Error('登入服務沒有回傳有效結果。');
  if(result.pending) result=await completion;
  if(result.cancelled){setMessage('已取消登入。');return;}
  if(result.error) throw new Error(result.error);
  $('email').value='';
  await loadAccounts();

  setMessage('Codex 登入成功，帳號已儲存。','success');
 } catch(error) {
  setMessage(error.message||String(error),'error');
 } finally {
  button.disabled=false; button.classList.remove('loading');
  $('cancelLoginButton').hidden=true;
  window.resolveLogin=null;
 }
}
async function handleExportAccounts(){try{const r=JSON.parse(await window.exportAccounts());if(r.error)throw Error(r.error);setMessage('帳號已匯出。','success')}catch(e){setMessage(e.message||String(e),'error')}}
async function handleImportAccounts(){try{const r=JSON.parse(await window.importAccounts());if(r.error)throw Error(r.error);await loadAccounts();setMessage('帳號已匯入。','success')}catch(e){setMessage(e.message||String(e),'error')}}
async function handleDetectCurrent() { try { if (typeof window.detectCurrent !== 'function') throw new Error('偵測服務尚未就緒，請重新啟動 App'); const raw=await window.detectCurrent(); const r=typeof raw==='string'?JSON.parse(raw):raw; if (!r || typeof r !== 'object') throw new Error('偵測服務回傳格式錯誤'); if(r.error) throw new Error(r.error); await loadAccounts(); setMessage(`已偵測並儲存 ${r.count} 個使用中的帳號。`,'success'); } catch(e) { setMessage(e.message||String(e),'error'); } }
function showDialog(title, text, okLabel='確認套用', confirmMode=true) {
 if(activeModal)return Promise.resolve(false);
 return new Promise(resolve => {
  $('dialogTitle').textContent=title;
  $('dialogText').textContent=text;
  $('dialogOK').textContent=okLabel;
  $('dialogCancel').hidden=!confirmMode;
  openModal('dialog',confirmMode?'dialogCancel':'dialogOK');
  const done=value=>{
   closeModal('dialog');
   $('dialogCancel').onclick=null;
   $('dialogOK').onclick=null;
   resolve(value);
  };
  $('dialogCancel').onclick=()=>done(false);
  $('dialogOK').onclick=()=>done(true);
 });
}
async function handleApplyAccount(id) {
 if(applyBusy || removeBusy || activeModal)return;
 applyBusy=true;
 try {
  const confirmed=await showDialog('套用 Codex 帳號','這會更新帳號資料與環境參數。套用後會依原始目錄啟動 Codex App。是否繼續？');
  if(!confirmed)return;
  setMessage('正在更新帳號資料與環境參數…');
  if(typeof window.useAccount!=='function')throw new Error('套用服務尚未就緒，請重新啟動 CodexSwitch');
  const completion=new Promise(resolve=>{window.resolveApply=resolve;});
  const raw=await window.useAccount(id);
  let result=typeof raw==='string'?JSON.parse(raw):raw;
  if(result?.pending)result=await completion;
  if(!result || result.error)throw new Error(result&&result.error||'套用服務回傳格式錯誤');
  await loadAccounts();
  const message='';
  setMessage(message,'success');
  await showDialog('套用完成',message,'關閉',false);
 } catch(error) {
  const message=error.message||String(error);
  setMessage(message,'error');
  await showDialog('套用失敗',message,'關閉',false);
 } finally {
  applyBusy=false;
  window.resolveApply=null;
 }
}
async function removeAccount(id) {
 if(removeBusy || applyBusy || activeModal)return;
 removeBusy=true;
 try {
  hideAccountTooltip();
  const account=accountRows.find(a=>a.id===id);
  const name=account?.email||'此帳號';
  if(!await showDialog('移除帳號',`確定要移除 ${name}？CodexSwitch 儲存的登入資料也會刪除。`,'確認移除'))return;
  if(typeof window.deleteAccount!=='function')throw new Error('移除服務尚未就緒，請重新啟動 CodexSwitch');
  const raw=await window.deleteAccount(id);
  const result=typeof raw==='string'?JSON.parse(raw):raw;
  if(!result || result.error)throw new Error(result?.error||'移除服務回傳格式錯誤');
  await loadAccounts();
  setMessage('帳號已移除。','success');
 } catch(e) { setMessage(e.message||String(e),'error'); }
 finally { removeBusy=false; }
}

// inert 之外也限制鍵盤焦點，以支援較舊的 WKWebView。
document.addEventListener('focusin',event=>{
 if(!activeModal)return;
 const modal=$(activeModal);
 if(!modal.contains(event.target))(modalFocusables(modal)[0]||modal).focus();
});
document.addEventListener('keydown',event=>{
 if(!activeModal || event.isComposing)return;
 const modal=$(activeModal);
 if(event.key==='Tab'){
  const items=modalFocusables(modal),first=items[0],last=items[items.length-1];
  if(!first){event.preventDefault();modal.focus();return;}
  if(!modal.contains(document.activeElement) || (event.shiftKey?document.activeElement===first:document.activeElement===last)){
   event.preventDefault();(event.shiftKey?last:first).focus();
  }
  return;
 }
 if(event.key!=='Escape')return;
 hideAccountTooltip();
 event.preventDefault();
 if(activeModal==='resetDialog')closeReset();
 else if(activeModal==='billingDialog')closeBilling();
 else if(activeModal==='settingsDialog')closeSettings();
 else if(activeModal==='aboutDialog')closeAbout();
 else if(activeModal==='dialog'){
  const button=$('dialogCancel').hidden?$('dialogOK'):$('dialogCancel');
  if(button.onclick)button.onclick();
 }
});
loadAccounts();
setInterval(refreshUsage,2000);
